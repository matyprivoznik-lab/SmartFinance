<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head>
    <title>Pravidelné faktury - mujDokladomat</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <th:block th:replace="~{fragments/assets :: head}"></th:block>
</head>
<body class="font-sans leading-normal tracking-normal min-h-screen flex flex-col">
<div th:replace="~{fragments/header :: main-header}"></div>
<main class="container mx-auto px-4 py-8 flex-grow max-w-3xl space-y-6">
    <div>
        <a href="/invoices" class="text-sm text-blue-700 font-semibold">&larr; Zpět na doklady</a>
        <h1 class="text-2xl font-black text-slate-900 mt-2">Pravidelné faktury</h1>
        <p class="text-sm text-slate-500 mt-1">Šablona vystaví fakturu v uvedený den a potom každý měsíc nebo čtvrtletí. Běh je každý den v 6:15.</p>
    </div>
    <div th:if="${successMessage}" class="bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm p-4 rounded-xl" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="bg-rose-50 border border-rose-200 text-rose-800 text-sm p-4 rounded-xl" th:text="${errorMessage}"></div>

    <form th:action="@{/invoices/recurring}" method="post" class="bg-white border border-slate-200 rounded-2xl p-6 space-y-4">
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Název šablony</label>
            <input name="title" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="Správa webu">
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Odběratel</label>
            <select name="clientId" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm">
                <option value="">Bez vazby na adresář</option>
                <option th:each="client : ${clients}" th:value="${client.id}" th:text="${client.name}">Klient</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Popis položky</label>
            <input name="description" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" placeholder="Měsíční správa webu">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Částka vč. DPH</label>
                <input name="unitPriceGross" type="number" step="0.01" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Sazba DPH</label>
                <select name="vatRate" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm">
                    <option value="21">21 %</option>
                    <option value="12">12 %</option>
                    <option value="0">0 %</option>
                </select>
            </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Režim</label>
                <select name="vatRegime" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm">
                    <option th:each="regime : ${vatRegimes}" th:value="${regime}" th:text="${regime.label}">Plátce</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Opakování</label>
                <select name="interval" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm">
                    <option value="MONTHLY">Každý měsíc</option>
                    <option value="QUARTERLY">Každé čtvrtletí</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">První vystavení</label>
                <input name="nextIssueDate" type="date" required class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm">
            </div>
        </div>
        <button type="submit" class="bg-blue-600 text-white font-bold px-5 py-2.5 rounded-xl text-sm">Uložit šablonu</button>
    </form>

    <section class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
        <p th:if="${templates == null or templates.empty}" class="p-6 text-sm text-slate-500">Zatím nemáš žádnou šablonu.</p>
        <table th:if="${templates != null and !templates.empty}" class="w-full text-sm">
            <thead class="bg-slate-50 text-left text-xs uppercase text-slate-500">
            <tr>
                <th class="px-4 py-3">Název</th>
                <th class="px-4 py-3">Další vystavení</th>
                <th class="px-4 py-3">Interval</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="template : ${templates}" class="border-t border-slate-100">
                <td class="px-4 py-3 font-semibold" th:text="${template.title}">Správa</td>
                <td class="px-4 py-3" th:text="${template.nextIssueDate}">2026-12-01</td>
                <td class="px-4 py-3" th:text="${template.interval.label}">měsíc</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<div th:replace="~{fragments/footer :: main-footer}"></div>
</body>
</html>
