<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MiniFaktura - Adresář kontaktů</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-100">

<div th:replace="~{fragments/header :: main-header}"></div>

<main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-10 flex-1 w-full space-y-6 sm:space-y-8">
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Seznam zákazníků</h1>

    <!-- Formulář pro přidání nového kontaktu -->
    <div class="app-card p-5 sm:p-6 bg-white">
        <h3 class="font-bold text-xs sm:text-sm uppercase tracking-wider mb-4 text-[var(--text-muted)]">Přidat nového zákazníka</h3>
        <form th:action="@{/clients/save}" th:object="${newClient}" method="post" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs sm:text-sm">
            <div>
                <label class="block font-medium text-[var(--text-muted)] mb-1">Název firmy / Jméno</label>
                <input type="text" th:field="*{name}" placeholder="např. Firma s.r.o." required class="w-full px-3 sm:px-4 py-2 border rounded-xl">
            </div>
            <div>
                <label class="block font-medium text-[var(--text-muted)] mb-1">IČO</label>
                <input type="text" th:field="*{ico}" placeholder="12345678" class="w-full px-3 sm:px-4 py-2 border rounded-xl">
            </div>
            <div>
                <label class="block font-medium text-[var(--text-muted)] mb-1">Adresa</label>
                <input type="text" th:field="*{address}" placeholder="Ulice 123, Město" required class="w-full px-3 sm:px-4 py-2 border rounded-xl">
            </div>
            <div>
                <label class="block font-medium text-[var(--text-muted)] mb-1">E-mail</label>
                <input type="email" th:field="*{email}" placeholder="zakaznik@firma.cz" class="w-full px-3 sm:px-4 py-2 border rounded-xl">
            </div>
            <div>
                <label class="block font-medium text-[var(--text-muted)] mb-1">Telefon</label>
                <input type="text" th:field="*{phone}" placeholder="+420 777 888 999" class="w-full px-3 sm:px-4 py-2 border rounded-xl">
            </div>
            <div class="flex items-end">
                <button type="submit" class="w-full btn-primary py-2.5 text-xs sm:text-sm">+ Uložit do adresáře</button>
            </div>
        </form>
    </div>

    <!-- Seznam uložených kontaktů -->
    <div class="app-card p-5 sm:p-6 bg-white">
        <h3 class="font-bold text-xs sm:text-sm uppercase tracking-wider mb-4 text-[var(--text-muted)]">Uložené kontakty</h3>
        <div th:if="${clients == null || clients.empty}" class="text-center py-8 text-sm text-[var(--text-muted)]">
            Zatím nemáte v adresáři žádné uložené zákazníky.
        </div>
        <div th:if="${clients != null && !clients.empty}" class="overflow-x-auto">
            <table class="w-full text-left text-xs sm:text-sm min-w-[550px]">
                <thead>
                <tr class="border-b text-[10px] sm:text-xs text-[var(--text-muted)] uppercase">
                    <th class="py-3 px-2">Název</th>
                    <th class="py-3 px-2">IČO</th>
                    <th class="py-3 px-2">Adresa</th>
                    <th class="py-3 px-2">E-mail / Tel</th>
                    <th class="py-3 px-2 text-center">Akce</th>
                </tr>
                </thead>
                <tbody class="divide-y">
                <tr th:each="c : ${clients}" class="hover:bg-slate-50">
                    <td class="py-3 px-2 font-bold text-[var(--text-main)]" th:text="${c.name}">Firma</td>
                    <td class="py-3 px-2 text-[var(--text-muted)]" th:text="${c.ico}">IČO</td>
                    <td class="py-3 px-2 text-[var(--text-muted)] truncate max-w-[150px]" th:text="${c.address}">Adresa</td>
                    <td class="py-3 px-2 text-[var(--text-muted)]">
                        <span th:text="${c.email}"></span><br>
                        <span class="text-[10px]" th:text="${c.phone}"></span>
                    </td>
                    <td class="py-3 px-2 text-center">
                        <form th:action="@{'/clients/delete/' + ${c.id}}" method="post" class="inline"
                              onsubmit="return confirm('Opravdu smazat klienta?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="text-xs text-rose-600 font-semibold hover:underline">Smazat</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: main-footer}"></div>
</body>
</html>
