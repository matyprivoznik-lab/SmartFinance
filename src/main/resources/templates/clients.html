<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mujDokladomat - Adresář kontaktů</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <th:block th:replace="~{fragments/assets :: head}"></th:block>
</head>
<body class="min-h-screen flex flex-col justify-between">

<div th:replace="~{fragments/header :: main-header}"></div>

<main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-10 flex-1 w-full space-y-6 sm:space-y-8">
    <h1 class="text-2xl font-black text-slate-900">Seznam zákazníků</h1>

    <form id="list-filter" method="get" th:action="@{/clients}" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 space-y-3">
        <div class="flex flex-col sm:flex-row gap-3">
            <label class="flex-1">
                <span class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Hledat</span>
                <input type="search" name="q" th:value="${q}" placeholder="Jméno, IČO, DIČ, e-mail nebo telefon" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm">
            </label>
            <label>
                <span class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">IČO</span>
                <select name="ico" class="w-full sm:w-44 px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-white">
                    <option value="">Všichni</option>
                    <option value="with" th:selected="${selectedIco == 'with'}">S IČO</option>
                    <option value="without" th:selected="${selectedIco == 'without'}">Bez IČO</option>
                </select>
            </label>
        </div>
        <div class="flex flex-wrap items-center gap-3 text-sm">
            <button type="submit" class="btn-primary px-4 py-2 text-sm">Hledat</button>
            <a th:if="${!q.isEmpty() or !selectedIco.isEmpty()}" href="/clients" class="font-semibold text-slate-500 hover:text-slate-800">Zrušit filtr</a>
            <p class="text-slate-500">Zobrazeno <span id="filter-count" th:text="${shownCount}">0</span> z <span th:text="${totalCount}">0</span></p>
        </div>
    </form>

    <!-- Formulář pro přidání nového kontaktu -->
    <div class="app-card p-5 sm:p-6 bg-white">
        <h3 class="font-bold text-xs sm:text-sm uppercase tracking-wider mb-4 text-[var(--text-muted)]">Přidat nového zákazníka</h3>
        <form th:action="@{/clients/save}" th:object="${newClient}" method="post" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs sm:text-sm">
            <div>
                <label class="block font-medium text-[var(--text-muted)] mb-1">Název firmy / Jméno</label>
                <input type="text" th:field="*{name}" placeholder="např. Firma s.r.o." required class="w-full px-3 sm:px-4 py-2 border rounded-xl">
            </div>
            <div>
                <label class="block font-medium text-[var(--text-muted)] mb-1">IČO</label>
                <input type="text" th:field="*{ico}" placeholder="12345678" class="w-full px-3 sm:px-4 py-2 border rounded-xl">
            </div>
            <div>
                <label class="block font-medium text-[var(--text-muted)] mb-1">Adresa</label>
                <input type="text" th:field="*{address}" placeholder="Ulice 123, Město" required class="w-full px-3 sm:px-4 py-2 border rounded-xl">
            </div>
            <div>
                <label class="block font-medium text-[var(--text-muted)] mb-1">E-mail</label>
                <input type="email" th:field="*{email}" placeholder="zakaznik@firma.cz" class="w-full px-3 sm:px-4 py-2 border rounded-xl">
            </div>
            <div>
                <label class="block font-medium text-[var(--text-muted)] mb-1">Telefon</label>
                <input type="text" th:field="*{phone}" placeholder="+420 777 888 999" class="w-full px-3 sm:px-4 py-2 border rounded-xl">
            </div>
            <div class="flex items-end">
                <button type="submit" class="w-full btn-primary py-2.5 text-xs sm:text-sm">+ Uložit do adresáře</button>
            </div>
        </form>
    </div>

    <!-- Seznam uložených kontaktů -->
    <div class="app-card p-5 sm:p-6 bg-white">
        <h3 class="font-bold text-xs sm:text-sm uppercase tracking-wider mb-4 text-[var(--text-muted)]">Uložené kontakty</h3>
        <div th:if="${totalCount == 0}" class="text-center py-8 text-sm text-[var(--text-muted)]">
            Zatím nemáte v adresáři žádné uložené zákazníky.
        </div>
        <p id="filter-empty" th:if="${totalCount > 0}" class="text-center py-8 text-sm text-slate-500" th:hidden="${shownCount > 0}">
            Tomuhle filtru nevyhovuje žádný kontakt.
        </p>
        <div th:if="${totalCount > 0}" class="overflow-x-auto">
            <table class="w-full text-left text-xs sm:text-sm min-w-[550px]">
                <thead>
                <tr class="border-b text-[10px] sm:text-xs text-[var(--text-muted)] uppercase">
                    <th class="py-3 px-2">Název</th>
                    <th class="py-3 px-2">IČO</th>
                    <th class="py-3 px-2">Adresa</th>
                    <th class="py-3 px-2">E-mail / Tel</th>
                    <th class="py-3 px-2">Riziko</th>
                    <th class="py-3 px-2 text-center">Akce</th>
                </tr>
                </thead>
                <tbody class="divide-y">
                <tr th:each="c : ${clients}" class="hover:bg-slate-50"
                    th:classappend="${!shownIds.contains(c.id)} ? 'is-filtered-out' : ''"
                    th:data-search="${clientSearch[c.id]}"
                    th:data-ico="${(c.ico != null and !c.ico.isBlank()) ? '1' : '0'}">
                    <td class="py-3 px-2 font-bold text-[var(--text-main)]" th:text="${c.name}">Firma</td>
                    <td class="py-3 px-2 text-[var(--text-muted)]" th:text="${c.ico}">IČO</td>
                    <td class="py-3 px-2 text-[var(--text-muted)] truncate max-w-[150px]" th:text="${c.address}">Adresa</td>
                    <td class="py-3 px-2 text-[var(--text-muted)]">
                        <span th:text="${c.email}"></span><br>
                        <span class="text-[10px]" th:text="${c.phone}"></span>
                    </td>
                    <td class="py-3 px-2 text-[var(--text-muted)] text-xs">
                        <span th:text="${c.riskInsolvency != null ? c.riskInsolvency : '—'}">—</span>
                        <span th:if="${c.riskUnreliableVat != null and c.riskUnreliableVat}" class="text-rose-700 font-bold"> nespolehlivý plátce</span>
                        <form th:action="@{'/clients/' + ${c.id} + '/risk'}" method="post" class="inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="text-xs text-blue-700 font-semibold hover:underline">Ověřit ISIR<span th:if="${!isPro}"> · Premium</span></button>
                        </form>
                    </td>
                    <td class="py-3 px-2 text-center">
                        <form th:action="@{'/clients/delete/' + ${c.id}}" method="post" class="inline"
                              onsubmit="return confirm('Opravdu smazat klienta?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="text-xs text-rose-600 font-semibold hover:underline">Smazat</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: main-footer}"></div>
<script th:src="@{/js/list-filter.js}"></script>
</body>
</html>
