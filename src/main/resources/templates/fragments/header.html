<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<body>

<header th:fragment="main-header" class="app-header sticky top-0 z-50 print:hidden">
    <script th:inline="javascript">
        (function () {
            var theme = /*[[${planTheme}]]*/ 'theme-free';
            document.body.classList.add(theme || 'theme-free');
        })();
    </script>
    <div class="container mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center gap-4">
        <div class="flex items-center space-x-5 sm:space-x-8 min-w-0">
            <a href="/dashboard" class="text-xl sm:text-2xl font-black tracking-tight text-[var(--primary)] shrink-0">MiniFaktura</a>

            <nav class="hidden md:flex space-x-5">
                <a href="/dashboard" class="nav-link text-sm font-medium transition py-1 border-b-2"
                   th:classappend="${activePage == 'dashboard'} ? 'nav-link-active' : 'nav-link-idle'">Přehled</a>
                <a href="/invoices" class="nav-link text-sm font-medium transition py-1 border-b-2"
                   th:classappend="${activePage == 'invoices'} ? 'nav-link-active' : 'nav-link-idle'">Faktury</a>
                <a href="/products" class="nav-link text-sm font-medium transition py-1 border-b-2"
                   th:classappend="${activePage == 'products'} ? 'nav-link-active' : 'nav-link-idle'">Sklad</a>
                <a href="/clients" class="nav-link text-sm font-medium transition py-1 border-b-2"
                   th:classappend="${activePage == 'clients'} ? 'nav-link-active' : 'nav-link-idle'">Kontakty</a>
                <a href="/taxes" class="nav-link text-sm font-medium transition py-1 border-b-2"
                   th:classappend="${activePage == 'taxes'} ? 'nav-link-active' : 'nav-link-idle'">Daně</a>
                <a href="/billing" class="nav-link text-sm font-medium transition py-1 border-b-2"
                   th:classappend="${activePage == 'billing'} ? 'nav-link-active' : 'nav-link-idle'">Předplatné</a>
                <a href="/settings" class="nav-link text-sm font-medium transition py-1 border-b-2"
                   th:classappend="${activePage == 'settings'} ? 'nav-link-active' : 'nav-link-idle'">Nastavení</a>
            </nav>
        </div>

        <div class="flex items-center gap-3 shrink-0">
            <a th:if="${!isPro}" href="/billing"
               class="quota-chip hidden sm:inline-flex items-center gap-1.5 text-xs font-bold px-3 py-1.5 rounded-full border"
               th:title="'Free limit: ' + ${invoiceQuotaUsed} + '/' + ${invoiceQuotaLimit} + ' faktur tento měsíc'">
                <span th:text="${invoiceQuotaUsed} + '/' + ${invoiceQuotaLimit}">0/5</span>
                <span class="opacity-70">faktur</span>
            </a>
            <span th:if="${isPro}"
                  class="pro-chip hidden sm:inline-flex text-xs font-bold px-3 py-1.5 rounded-full">
                Pro · neomezeně
            </span>

            <form th:action="@{/logout}" method="post" class="inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="text-xs sm:text-sm font-semibold text-slate-500 hover:text-red-600 transition">
                    Odhlásit se
                </button>
            </form>
        </div>
    </div>
</header>

</body>
</html>
