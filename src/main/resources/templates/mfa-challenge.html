<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dvoufázové ověření | MiniFaktura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

<div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-200">
    <div class="text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4">
            <i class="fa-solid fa-shield-halved text-2xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">Dvoufázové ověření</h2>
        <p class="mt-2 text-sm text-gray-600">
            Otevřete aplikaci <strong>Google Authenticator</strong> (nebo jinou TOTP aplikaci) a zadejte 6místný kód.
        </p>
    </div>

    <!-- Chybová hláška při chybném kódu -->
    <div th:if="${param.error}" class="bg-red-50 border-l-4 border-red-500 p-4 rounded text-sm text-red-700">
        <div class="flex items-center">
            <i class="fa-solid fa-triangle-exclamation mr-2 text-red-500"></i>
            <span>Neplatný nebo vypršený ověřovací kód. Zkuste to znovu.</span>
        </div>
    </div>

    <form th:action="@{/login/mfa}" method="post" class="mt-8 space-y-6">
        <div>
            <label for="code" class="block text-sm font-medium text-gray-700 mb-1 text-center">
                Ověřovací kód (6 číslic)
            </label>
            <input id="code"
                   name="code"
                   type="text"
                   inputmode="numeric"
                   pattern="[0-9]*"
                   maxlength="6"
                   required
                   autofocus
                   placeholder="123456"
                   class="appearance-none relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-lg text-center font-mono text-2xl tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
            <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                <i class="fa-solid fa-key mr-2 mt-0.5"></i> Ověřit a přihlásit
            </button>
        </div>
    </form>

    <div class="text-center mt-4">
        <a th:href="@{/login?logout}" class="text-sm font-medium text-gray-500 hover:text-gray-700 transition-colors">
            <i class="fa-solid fa-arrow-left mr-1"></i> Zpět na přihlášení
        </a>
    </div>
</div>

</body>
</html>
