<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dvoufázové ověření | mujDokladomat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <th:block th:replace="~{fragments/assets :: head}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="font-sans leading-normal tracking-normal min-h-screen flex flex-col">

<main class="flex-grow flex items-center justify-center px-4 py-12">
<div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-2xl shadow-sm border border-slate-200">
    <div class="text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4">
            <i class="fa-solid fa-shield-halved text-2xl"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900">Dvoufázové ověření</h1>
        <p class="mt-2 text-sm text-slate-500">
            Otevřete aplikaci <strong>Google Authenticator</strong> (nebo jinou TOTP aplikaci) a zadejte 6místný kód.
        </p>
    </div>

    <!-- Chybová hláška při chybném kódu -->
    <div th:if="${param.error}" class="bg-red-50 border-l-4 border-red-500 p-4 rounded text-sm text-red-700">
        <div class="flex items-center">
            <i class="fa-solid fa-triangle-exclamation mr-2 text-red-500"></i>
            <span>Neplatný nebo vypršený ověřovací kód. Zkuste to znovu.</span>
        </div>
    </div>

    <form th:action="@{/login/mfa}" method="post" class="mt-8 space-y-6">
        <div>
            <label for="code" class="block text-sm font-semibold text-slate-700 mb-1 text-center">
                Ověřovací kód (6 číslic)
            </label>
            <input id="code"
                   name="code"
                   type="text"
                   inputmode="numeric"
                   pattern="[0-9]*"
                   maxlength="6"
                   required
                   autofocus
                   placeholder="123456"
                   class="appearance-none relative block w-full px-4 py-3 border border-slate-300 placeholder-slate-400 text-slate-900 rounded-xl text-center font-mono text-2xl tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
            <button type="submit"
                    class="btn-primary w-full py-3 px-4 text-sm">
                <i class="fa-solid fa-key mr-2 mt-0.5"></i> Ověřit a přihlásit
            </button>
        </div>
    </form>

    <div class="text-center mt-4">
        <a th:href="@{/login?logout}" class="text-sm font-semibold text-slate-500 hover:text-slate-700 transition-colors">
            <i class="fa-solid fa-arrow-left mr-1"></i> Zpět na přihlášení
        </a>
    </div>
</div>
</main>
</body>
</html>
