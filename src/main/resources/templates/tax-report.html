<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Daňový přehled</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans leading-normal tracking-normal min-h-screen flex flex-col">
<div th:replace="~{fragments/header :: main-header}"></div>
<main class="container mx-auto px-4 sm:px-6 py-8 flex-grow max-w-2xl w-full">
    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-gray-200 space-y-4">
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-2">Podklad pro daňové přiznání</h1>
        <div class="space-y-2 text-sm text-gray-700">
            <p>Rok: <span class="font-semibold text-gray-900" th:text="${summary.year}">2026</span></p>
            <p>Celkové příjmy: <span class="font-semibold text-gray-900" th:text="${summary.taxableRevenue}">0</span> Kč</p>
            <p>Paušální výdaje: <span class="font-semibold text-gray-900" th:text="${summary.flatExpenses}">0</span> Kč</p>
            <p>Základ daně: <span class="font-semibold text-gray-900" th:text="${summary.incomeTaxBase}">0</span> Kč</p>
            <p>Daň z příjmů: <span class="font-semibold text-gray-900" th:text="${summary.incomeTaxDue}">0</span> Kč</p>
        </div>

        <div class="pt-4">
            <a th:href="@{/taxes/export(year=${summary.year})}">
                <button type="button" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-3 px-4 rounded-xl shadow transition">
                    Stáhnout podklady pro účetní (CSV)
                </button>
            </a>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: main-footer}"></div>
</body>
</html>
