spring.application.name=fakturace

# H2 in-memory database (dev)
spring.datasource.url=jdbc:h2:mem:fakturabdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console: výchozí vypnuto. Zapni jen lokálně: app.security.h2-console-enabled=true
spring.h2.console.enabled=false
app.security.h2-console-enabled=false

# Dates in forms (input type=date) use ISO yyyy-MM-dd
spring.mvc.format.date=iso

# SMTP (e.g. Gmail) - fill in real values
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tvuj.email@gmail.com
spring.mail.password=tve-aplikacni-heslo
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Do not let the unconfigured mail server mark the app as DOWN
management.health.mail.enabled=false

# Stripe: nastav env STRIPE_* nebo spusť s profilem local (application-local.properties).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
billing.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
billing.stripe.monthly-price-id=${STRIPE_PRICE_MONTHLY:}
billing.stripe.yearly-price-id=${STRIPE_PRICE_YEARLY:}
