spring.application.name=fakturace

# PostgreSQL. Override with SPRING_DATASOURCE_* when the database is not local.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fakturace}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fakturace}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fakturace}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Dates in forms (input type=date) use ISO yyyy-MM-dd
spring.mvc.format.date=iso

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# SMTP (e.g. Gmail) - fill in real values
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tvuj.email@gmail.com
spring.mail.password=tve-aplikacni-heslo
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Do not let the unconfigured mail server mark the app as DOWN
management.health.mail.enabled=false

# Stripe: nastav env STRIPE_* nebo spusť s profilem local (application-local.properties).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
billing.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
billing.stripe.monthly-price-id=${STRIPE_PRICE_MONTHLY:}
billing.stripe.yearly-price-id=${STRIPE_PRICE_YEARLY:}
